name: GO Build
description: build go codes using taskfiles
inputs:
  go-version:
    description: "GO version to use"
    required: false
    default: "1.21"
  working-directory:
    description: "The current working directory"
    required: false
    default: "."
  flags:
    description: "Building flags"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup GO
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: true

    - name: Clean Go cache before restore
      shell: bash
      run: go clean -modcache
      continue-on-error: true

    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x

    - name: Build Release
      shell: bash
      run: task build
